<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カヴィヴァラチャット</title>
<meta name="description" content="結社の内部事情を聞こう。カヴィヴァラチャット公式ダウンロードページ">
<style>
  :root {
    --bg: #3a3a3a;
    --fg: #f2ede3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .container {
    max-width: 480px;
    text-align: center;
  }
  .hero {
    display: block;
    width: 168px;
    max-width: 55%;
    height: auto;
    margin: 0 auto 20px;
  }
  .tagline {
    font-size: 15px;
    letter-spacing: 0.15em;
    opacity: 0.85;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 0.08em;
    margin-bottom: 28px;
  }
  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid rgba(242, 237, 227, 0.25);
    border-top-color: var(--fg);
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status {
    font-size: 14px;
    opacity: 0.75;
    margin-bottom: 36px;
  }
  .badges {
    display: none;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: center;
  }
  .badges.show { display: flex; }
  .badge {
    display: inline-block;
    transition: opacity 0.2s;
  }
  .badge:hover { opacity: 0.75; }
  .badge img {
    display: block;
    width: auto;
  }
  /* App Store バッジは余白なし、Google Play バッジは画像内に約10%の余白があるため、
     見た目の高さを揃えるように個別に指定する */
  .badge-ios img { height: 44px; }
  .badge-android img { height: 64px; }
  .note {
    margin-top: 32px;
    font-size: 12px;
    opacity: 0.5;
    line-height: 1.8;
  }
</style>
</head>
<body>
<div class="container">
  <img class="hero" src="cavivara.png" alt="カヴィヴァラさん" width="333" height="320">
  <p class="tagline">結社の内部事情を聞こう</p>
  <h1>カヴィヴァラチャット</h1>

  <div class="spinner" id="spinner"></div>
  <p class="status" id="status">ストアへ移動しています…</p>

  <!-- href はパラメータ無しでアクセスされた場合のURL。
       スクリプトがクエリパラメータを反映したURLで上書きする -->
  <div class="badges" id="badges">
    <a class="badge badge-ios" href="https://apps.apple.com/app/apple-store/id6754788785">
      <img src="https://toolbox.marketingtools.apple.com/api/v2/badges/download-on-the-app-store/black/ja-jp"
           alt="App Store からダウンロード" width="132" height="44"
           loading="lazy" decoding="async" fetchpriority="low">
    </a>
    <a class="badge badge-android" href="https://play.google.com/store/apps/details?id=ide.shota.colomney.CavivaraTalk">
      <img src="https://play.google.com/intl/en_us/badges/static/images/badges/ja_badge_web_generic.png"
           alt="Google Play で手に入れよう" width="165" height="64"
           loading="lazy" decoding="async" fetchpriority="low">
    </a>
  </div>

  <p class="note">
    自動で移動しない場合は上のボタンからお進みください。<br>
    ※当結社は合法です
  </p>
</div>

<script>
/*
 * 計測パラメータの受け渡し設計
 *
 * 配布するURLは1つだけ（例: https://<このページ>/?utm_source=plectrum-association
 * &utm_medium=display&utm_campaign=regular-concert-11_booklet ）とし、
 * このページがOSを判定して各ストアのURLへ変換してから遷移させる。
 * Google PlayはUTMパラメータをそのまま解釈できるが、App Storeは独自のトークンしか
 * 解釈しないため、同じクエリ文字列をそのまま渡すと iOS 側だけ計測できなくなる。
 *
 * 1. ページ側の入力形式はUTMパラメータに統一する
 *    CAMPAIGN_PARAM_KEYS のUTMパラメータを受け付ける。
 *    既定値による補完はしない。ページにパラメータが無ければストアのURLにも付与せず、
 *    ストアが解釈しないパラメータも引き継がない。
 *
 * 2. Android（Google Play）はUTMパラメータをトップレベルに並べる
 *    値があるUTMパラメータのみを、変換せずにPlayのURLへ引き継ぐ。
 *    id（パッケージ名）は固定で、ページ側から上書きさせない。
 *
 * 3. iOS（App Store）は pt / ct / mt へ詰め替える
 *    Appleが解釈するのはこの3つだけで、utm_* を付けても無視される。
 *    - pt: Apple Services Performance Partnersのプロバイダートークン。ページの pt をそのまま使う。
 *    - ct: キャンペーントークン。ページの ct を優先し、無ければ utm_campaign を使う。
 *    - mt: メディアタイプ。ページの mt をそのまま使う。
 */
(function () {
  var APP_STORE_ID = "6754788785";
  var ANDROID_PACKAGE_NAME = "ide.shota.colomney.CavivaraTalk";

  // Google Playが解釈するUTMパラメータ。URLに並べる順序も兼ねる
  var CAMPAIGN_PARAM_KEYS = [
    "utm_source",
    "utm_medium",
    "utm_campaign",
    "utm_content",
    "utm_term"
  ];

  function buildAndroidUrl(params) {
    var url = new URL("https://play.google.com/store/apps/details");
    url.searchParams.set("id", ANDROID_PACKAGE_NAME);
    CAMPAIGN_PARAM_KEYS.forEach(function (key) {
      var value = params.get(key);
      if (value) {
        url.searchParams.set(key, value);
      }
    });
    return url.toString();
  }

  function buildIosUrl(params) {
    var url = new URL("https://apps.apple.com/app/apple-store/id" + APP_STORE_ID);
    var providerToken = params.get("pt");
    if (providerToken) {
      url.searchParams.set("pt", providerToken);
    }
    var campaignToken = params.get("ct") || params.get("utm_campaign");
    if (campaignToken) {
      url.searchParams.set("ct", campaignToken);
    }
    var mediaType = params.get("mt");
    if (mediaType) {
      url.searchParams.set("mt", mediaType);
    }
    return url.toString();
  }

  var params = new URLSearchParams(location.search);
  var androidUrl = buildAndroidUrl(params);
  var iosUrl = buildIosUrl(params);

  document.querySelector(".badge-ios").href = iosUrl;
  document.querySelector(".badge-android").href = androidUrl;

  var ua = navigator.userAgent || "";
  // iPadOS 13以降はMacintoshを名乗るためタッチ判定を併用
  var isIOS = /iPhone|iPad|iPod/.test(ua) ||
              (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);

  function showFallback() {
    document.getElementById("spinner").style.display = "none";
    document.getElementById("status").style.display = "none";
    document.getElementById("badges").classList.add("show");
  }

  if (isIOS) {
    location.replace(iosUrl);
  } else if (isAndroid) {
    location.replace(androidUrl);
  } else {
    // PCなど: 両ストアのボタンを表示
    showFallback();
    return;
  }

  // リダイレクトがブロックされた場合の保険（1.5秒後にボタン表示）
  setTimeout(showFallback, 1500);
})();
</script>
</body>
</html>
